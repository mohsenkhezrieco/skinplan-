name: Cache product packshots

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "products.json"
      - "product-image-sources.json"
      - "scripts/fetch-product-images.mjs"
      - ".github/workflows/cache-product-images.yml"

permissions:
  contents: write

jobs:
  cache-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - run: npm run cache-images

      - name: Commit cached images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/products
          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "Cache local product packshots [skip image cache]"
            git push
          fi
